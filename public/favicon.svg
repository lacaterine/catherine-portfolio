<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Soft, elegant dark navy/plum background -->
  <rect x="0" y="0" width="100" height="100" rx="30" fill="#1e1b4b"/>
  
  <!-- Large elegant cursive 'C' placed on the left side -->
  <text x="40" y="68" 
        font-family="'Brush Script MT', 'Lucida Handwriting', 'Segoe Script', cursive" 
        font-size="65" 
        fill="#fda4af" 
        text-anchor="middle">C</text>
        
  <!-- Smaller cursive 'L' nested beautifully inside the bowl of the C -->
  <text x="60" y="60" 
        font-family="'Brush Script MT', 'Lucida Handwriting', 'Segoe Script', cursive" 
        font-size="40" 
        fill="#fff1f2" 
        text-anchor="middle">L</text>
</svg>
